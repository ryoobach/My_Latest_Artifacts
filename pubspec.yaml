name: my_latest_artifacts
description: Cross-platform latest build artifact dashboard.
publish_to: "none"
version: 0.2.13+15

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - js_logo.png
    - my latest artifacts icon.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "my latest artifacts icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
