name: First Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath My_Latest_Artifacts_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: My_Latest_Artifacts_Windows_x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release
      - run: tar -czf My_Latest_Artifacts_Linux_x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: My_Latest_Artifacts_Linux_x64.tar.gz

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app My_Latest_Artifacts_iOS_unsigned_app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: My_Latest_Artifacts_iOS_unsigned_app.zip

  package:
    needs: [android, windows, linux, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - run: |
          mkdir -p package
          cp release-files/android-apk/app-release.apk package/My_Latest_Artifacts_Android.apk
          cp release-files/windows-x64/My_Latest_Artifacts_Windows_x64.zip package/
          cp release-files/linux-x64/My_Latest_Artifacts_Linux_x64.tar.gz package/
          cp release-files/ios-unsigned-app/My_Latest_Artifacts_iOS_unsigned_app.zip package/
          cd package
          zip -r ../My_Latest_Artifacts_v0.1.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: My_Latest_Artifacts_v0.1.0
          path: My_Latest_Artifacts_v0.1.0.zip
