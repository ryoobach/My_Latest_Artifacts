name: Build My Latest Artifacts v0.2.8

on:
  push:
    branches: [main, feature/github-device-flow-v0.2.8]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build Android APK with retry for transient repository throttling
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              cp build/app/outputs/flutter-apk/app-release.apk My_Latest_Artifacts_Androidv0.2.8.apk
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after backoff (attempt $attempt of 3)."
              sleep $((attempt * 30))
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: My_Latest_Artifacts_Androidv0.2.8.apk
          path: My_Latest_Artifacts_Androidv0.2.8.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Apply custom Windows executable icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          @'
          from PIL import Image
          from pathlib import Path
          source = Image.open("my latest artifacts icon.jpg").convert("RGB")
          side = max(source.size)
          canvas = Image.new("RGB", (side, side), (255, 255, 255))
          canvas.paste(source, ((side - source.width) // 2, (side - source.height) // 2))
          target = Path("windows/runner/resources/app_icon.ico")
          target.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(target, format="ICO", sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          if not target.exists() or target.stat().st_size == 0:
              raise SystemExit("Windows ICO generation failed")
          '@ | python -
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath My_Latest_Artifacts_Windowsv0.2.8.zip
      - uses: actions/upload-artifact@v4
        with:
          name: My_Latest_Artifacts_Windowsv0.2.8.zip
          path: My_Latest_Artifacts_Windowsv0.2.8.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build Linux with compatibility for bundled JSON header warning
        run: CXXFLAGS='-Wno-error=deprecated-literal-operator' flutter build linux --release
      - run: tar -czf My_Latest_Artifacts_Linuxv0.2.8.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: My_Latest_Artifacts_Linuxv0.2.8.tar.gz
          path: My_Latest_Artifacts_Linuxv0.2.8.tar.gz
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      # Simulator build does not require an Apple Development Team or provisioning profile.
      - run: flutter build ios --simulator --debug
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app My_Latest_Artifacts_iOSv0.2.8.zip
      - uses: actions/upload-artifact@v4
        with:
          name: My_Latest_Artifacts_iOSv0.2.8.zip
          path: My_Latest_Artifacts_iOSv0.2.8.zip
          if-no-files-found: error

  release:
    needs: [android, windows, linux, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: My_Latest_Artifacts_Androidv0.2.8.apk
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: My_Latest_Artifacts_Windowsv0.2.8.zip
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: My_Latest_Artifacts_Linuxv0.2.8.tar.gz
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: My_Latest_Artifacts_iOSv0.2.8.zip
          path: release-files
      - name: Publish direct download files on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.8 \
            release-files/My_Latest_Artifacts_Androidv0.2.8.apk \
            release-files/My_Latest_Artifacts_Windowsv0.2.8.zip \
            release-files/My_Latest_Artifacts_Linuxv0.2.8.tar.gz \
            release-files/My_Latest_Artifacts_iOSv0.2.8.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "My Latest Artifacts v0.2.8" \
            --notes "Direct platform downloads. Download the Windows ZIP asset directly; do not use the Actions artifact wrapper. The iOS package is a simulator build, not an installable IPA."
