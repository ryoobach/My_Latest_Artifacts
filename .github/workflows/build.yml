name: First Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build Android APK with retry for transient repository throttling
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after backoff (attempt $attempt of 3)."
              sleep $((attempt * 30))
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Apply custom Windows executable icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          @'
          from PIL import Image
          from pathlib import Path
          source = Image.open("my latest artifacts icon.jpg").convert("RGB")
          side = max(source.size)
          canvas = Image.new("RGB", (side, side), (255, 255, 255))
          canvas.paste(source, ((side - source.width) // 2, (side - source.height) // 2))
          target = Path("windows/runner/resources/app_icon.ico")
          target.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(target, format="ICO", sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          if not target.exists() or target.stat().st_size == 0:
              raise SystemExit("Windows ICO generation failed")
          '@ | python -
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath My_Latest_Artifacts_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: My_Latest_Artifacts_Windows_x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release
      - run: tar -czf My_Latest_Artifacts_Linux_x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: My_Latest_Artifacts_Linux_x64.tar.gz

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,windows,linux --project-name=my_latest_artifacts .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      # Simulator build does not require an Apple Development Team or provisioning profile.
      - run: flutter build ios --simulator --release
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app My_Latest_Artifacts_iOS_Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: My_Latest_Artifacts_iOS_Simulator.zip

  package:
    needs: [android, windows, linux, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - run: |
          mkdir -p package
          cp release-files/android-apk/app-release.apk package/My_Latest_Artifacts_Android.apk
          cp release-files/windows-x64/My_Latest_Artifacts_Windows_x64.zip package/
          cp release-files/linux-x64/My_Latest_Artifacts_Linux_x64.tar.gz package/
          cp release-files/ios-simulator-app/My_Latest_Artifacts_iOS_Simulator.zip package/
          cd package
          zip -r ../My_Latest_Artifacts_v0.2.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: My_Latest_Artifacts_v0.2.0
          path: My_Latest_Artifacts_v0.2.0.zip
